<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7ed0e8">
<link rel="icon" href="icone.png">
<link rel="apple-touch-icon" href="icone.png">
<title>Jogos da Nina 🎮</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    min-height: 100%;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: "Comic Sans MS", "Chalkboard SE", cursive, sans-serif;
    background: linear-gradient(170deg, #aee9f5 0%, #d8f7e0 55%, #ffe6a7 100%);
    background-attachment: fixed;
    color: #2e5e2e;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 22px 16px 12px;
    overflow-x: hidden;
  }

  /* ---------- topo ---------- */
  .topo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 3vw, 26px);
    flex-wrap: wrap;
    text-align: center;
  }
  .logo {
    width: clamp(134px, 38vw, 176px);
    height: auto;
    border-radius: 50%;
    border: 5px solid #fff;
    background: #aee9f5;
    box-shadow: 0 8px 20px rgba(0,0,0,0.22);
    animation: flutuaLogo 4.5s ease-in-out infinite;
  }
  @keyframes flutuaLogo {
    0%, 100% { transform: translateY(0) rotate(-2deg) }
    50%      { transform: translateY(-9px) rotate(2deg) }
  }
  h1 {
    font-size: clamp(34px, 9vw, 56px);
    color: #e63329;
    text-shadow: 3px 3px 0 #fff, 5px 5px 0 rgba(0,0,0,0.08);
    text-align: center;
    line-height: 1.1;
    animation: gingado 3.5s ease-in-out infinite;
  }
  @keyframes gingado {
    0%, 100% { transform: rotate(-1.5deg) }
    50%      { transform: rotate(1.5deg) }
  }
  .sub {
    margin-top: 8px;
    font-size: clamp(16px, 4.5vw, 21px);
    color: #2e7d32;
    text-align: center;
  }

  /* ---------- cartões ---------- */
  .jogos {
    width: 100%;
    max-width: 860px;
    margin-top: 26px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
  }
  .jogo {
    display: block;
    text-decoration: none;
    color: inherit;
    background: #fff;
    border: 5px solid #fff;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 8px 22px rgba(0,0,0,0.16);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .jogo:active { transform: scale(0.96); }
  @media (hover: hover) {
    .jogo:hover { transform: translateY(-6px) rotate(-1deg); box-shadow: 0 14px 28px rgba(0,0,0,0.22); }
  }
  .capa {
    position: relative;
    height: 190px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    overflow: hidden;
  }
  .capa img { height: 150px; filter: drop-shadow(0 5px 6px rgba(0,0,0,0.25)); }
  .nome {
    padding: 12px 14px 14px;
    text-align: center;
  }
  .nome b {
    display: block;
    font-size: 25px;
    color: #d33;
  }
  .nome span {
    display: block;
    margin-top: 3px;
    font-size: 15px;
    color: #4a7a4a;
  }
  .nome .botao {
    display: inline-block;
    margin-top: 10px;
    background: #2e9e44;
    color: #fff;
    border-radius: 999px;
    padding: 8px 26px;
    font-size: 20px;
    font-weight: bold;
    box-shadow: 0 4px 0 #1f7530;
  }

  /* capa 1 — melancia */
  .capa-melancia { background: linear-gradient(180deg, #aee9f5, #b6ecab); }
  .capa-melancia .fruta {
    position: absolute;
    font-size: 40px;
    animation: flutua 2.6s ease-in-out infinite;
  }
  .capa-melancia .f1 { left: 12%;  top: 22%; animation-delay: 0s; }
  .capa-melancia .f2 { right: 12%; top: 14%; animation-delay: .5s; }
  .capa-melancia .f3 { right: 22%; top: 52%; animation-delay: 1s; font-size: 30px; }
  @keyframes flutua {
    0%, 100% { transform: translateY(0) rotate(-6deg) }
    50%      { transform: translateY(-10px) rotate(6deg) }
  }

  /* capa 2 — memória */
  .capa-memoria { background: linear-gradient(180deg, #f6c7e8, #cbb6f2); }
  .capa-memoria .carta {
    position: absolute;
    bottom: 12px;
    width: 92px; height: 118px;
    background: #fff;
    border: 4px solid #fff;
    border-radius: 14px;
    box-shadow: 0 5px 12px rgba(0,0,0,0.22);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .capa-memoria .carta img { height: 96px; filter: none; }
  .capa-memoria .c1 { transform: rotate(-13deg) translateX(-96px); }
  .capa-memoria .c2 { transform: rotate(2deg); z-index: 2; }
  .capa-memoria .c3 {
    transform: rotate(13deg) translateX(96px);
    background: repeating-linear-gradient(45deg, #ff4f58 0 14px, #e63329 14px 28px);
    font-size: 44px;
  }

  /* capa 3 — em breve */
  .embreve { opacity: 0.75; }
  .capa-breve {
    background: linear-gradient(180deg, #ffe6a7, #ffd0d0);
    align-items: center;
    font-size: 74px;
  }
  .embreve .nome .botao { background: #b9a06a; box-shadow: 0 4px 0 #907c50; }

  footer {
    margin: 26px 0 6px;
    font-size: 16px;
    color: #2e6e2e;
    text-shadow: 0 1px 2px rgba(255,255,255,0.8);
    text-align: center;
  }
</style>
</head>
<body>

<div class="topo">
  <img class="logo" src="nina.png" alt="Nina no balão">
  <div>
    <h1>Jogos da Nina</h1>
    <p class="sub">Escolhe um jogo pra brincar! 👇</p>
  </div>
</div>

<div class="jogos">

  <a class="jogo" href="melancia/">
    <div class="capa capa-melancia">
      <span class="fruta f1">🍉</span>
      <span class="fruta f2">🍉</span>
      <span class="fruta f3">🍉</span>
      <img src="melancia/magali.png" alt="Magali">
    </div>
    <div class="nome">
      <b>Magali Melancia</b>
      <span>Corre atrás das melancias e come todas! 🍉</span>
      <span class="botao">JOGAR</span>
    </div>
  </a>

  <a class="jogo" href="memoria/">
    <div class="capa capa-memoria">
      <div class="carta c1"><img src="memoria/img/monica.png" alt="Mônica"></div>
      <div class="carta c2"><img src="memoria/img/cebolinha.png" alt="Cebolinha"></div>
      <div class="carta c3">🍉</div>
    </div>
    <div class="nome">
      <b>Memória da Turma</b>
      <span>Vira as cartas e acha os pares iguais! 🧠</span>
      <span class="botao">JOGAR</span>
    </div>
  </a>

  <div class="jogo embreve">
    <div class="capa capa-breve">🎁</div>
    <div class="nome">
      <b>Em breve...</b>
      <span>Tem jogo novo chegando pra você! ✨</span>
      <span class="botao">AGUARDE</span>
    </div>
  </div>

</div>

<footer>feito por Marina Vaz 💚</footer>

</body>
</html>
