<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Magali Melancia 🍉</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    background: #aee9f5;
    font-family: "Comic Sans MS", "Chalkboard SE", cursive, sans-serif;
  }
  #game {
    display: block;
    width: 100%; height: 100%;
    touch-action: none;
  }
  #placar {
    position: fixed;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.9);
    border: 4px solid #2e9e44;
    border-radius: 999px;
    padding: 8px 26px;
    font-size: 34px;
    font-weight: bold;
    color: #d33;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    pointer-events: none;
    white-space: nowrap;
    z-index: 10;
  }
  #credito {
    position: fixed;
    bottom: 6px; left: 50%;
    transform: translateX(-50%);
    font-size: 15px;
    color: #2e6e2e;
    text-shadow: 0 1px 2px rgba(255,255,255,0.8);
    pointer-events: none;
    z-index: 10;
    white-space: nowrap;
  }
  #dica {
    position: fixed;
    bottom: 34px; left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.85);
    border-radius: 999px;
    padding: 10px 22px;
    font-size: 20px;
    color: #2e6e2e;
    pointer-events: none;
    z-index: 10;
    transition: opacity 0.8s;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="placar">🍉 0</div>
<div id="dica">Arraste a Magali até a melancia! 👆</div>
<div id="credito">feito por Marina Vaz 💚</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const placarEl = document.getElementById('placar');
  const dicaEl = document.getElementById('dica');

  // imagem oficial da Magali
  const magaliImg = new Image();
  magaliImg.src = 'magali.png';
  const MAG_H = 170; // altura dela na tela

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Estado ----------
  const magali = {
    x: W / 2, y: H / 2,
    tx: W / 2, ty: H / 2,   // alvo (dedo)
    r: 62,                   // raio de colisão
    eating: 0,               // timer da animação de comer
    face: 1,                 // 1 = olhando pra direita, -1 esquerda
    bob: 0
  };
  let score = 0;
  const melancias = [];
  const particulas = [];
  const nhams = [];   // textos "NHAM!" flutuando
  const nuvens = [];
  let dragging = false;
  let hideDica = false;

  for (let i = 0; i < 4; i++) {
    nuvens.push({
      x: Math.random() * W,
      y: 40 + Math.random() * (H * 0.25),
      s: 0.6 + Math.random() * 0.8,
      v: 8 + Math.random() * 12
    });
  }

  function novaMelancia() {
    const margem = 70;
    let x, y, tenta = 0;
    do {
      x = margem + Math.random() * (W - margem * 2);
      y = margem + 60 + Math.random() * (H - margem * 2 - 60);
      tenta++;
    } while (Math.hypot(x - magali.x, y - magali.y) < 200 && tenta < 30);
    melancias.push({ x, y, r: 34, t: Math.random() * Math.PI * 2, nascendo: 0 });
  }
  for (let i = 0; i < 3; i++) novaMelancia();

  // ---------- Som ----------
  let audioCtx = null;
  function tocaNham() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      // "nhac" - dois bipes alegres
      [ [523, 0], [784, 0.09] ].forEach(([f, d]) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(f, t + d);
        o.frequency.exponentialRampToValueAtTime(f * 1.5, t + d + 0.08);
        g.gain.setValueAtTime(0.25, t + d);
        g.gain.exponentialRampToValueAtTime(0.001, t + d + 0.15);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t + d); o.stop(t + d + 0.16);
      });
    } catch (e) { /* sem som, sem problema */ }
  }

  // ---------- Controles (dedo ou mouse) ----------
  function setAlvo(cx, cy) {
    magali.tx = Math.max(40, Math.min(W - 40, cx));
    magali.ty = Math.max(80, Math.min(H - 40, cy));
  }
  canvas.addEventListener('pointerdown', e => {
    dragging = true;
    setAlvo(e.clientX, e.clientY);
    if (!hideDica) { hideDica = true; dicaEl.style.opacity = 0; }
    // cria o contexto de áudio no primeiro toque (gesto do usuário)
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (err) {}
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', e => {
    if (dragging) { setAlvo(e.clientX, e.clientY); e.preventDefault(); }
  });
  window.addEventListener('pointerup', () => { dragging = false; });
  window.addEventListener('pointercancel', () => { dragging = false; });

  // ---------- Teclado (setas ou WASD no PC) ----------
  const teclas = {};
  const mapaTeclas = {
    ArrowUp: 'cima', ArrowDown: 'baixo', ArrowLeft: 'esq', ArrowRight: 'dir',
    w: 'cima', s: 'baixo', a: 'esq', d: 'dir',
    W: 'cima', S: 'baixo', A: 'esq', D: 'dir'
  };
  window.addEventListener('keydown', e => {
    const dir = mapaTeclas[e.key];
    if (!dir) return;
    teclas[dir] = true;
    if (!hideDica) { hideDica = true; dicaEl.style.opacity = 0; }
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (err) {}
    e.preventDefault();
  });
  window.addEventListener('keyup', e => {
    const dir = mapaTeclas[e.key];
    if (dir) teclas[dir] = false;
  });

  // ---------- Desenho da Magali (imagem oficial) ----------
  function desenhaMagali(x, y, face, eating, bob) {
    const prop = magaliImg.naturalWidth ? magaliImg.naturalWidth / magaliImg.naturalHeight : 0.667;
    const w = MAG_H * prop;
    ctx.save();
    ctx.translate(x, y + Math.sin(bob) * 4);

    // sombra no chao
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.beginPath();
    ctx.ellipse(0, MAG_H / 2 - 4, w * 0.42, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // balancinho ao andar
    ctx.rotate(Math.sin(bob * 0.8) * 0.03);

    // animacao de comer: pula e estica de alegria
    if (eating > 0) {
      const s = Math.sin(eating * 22) * 0.09;
      ctx.scale(1 + s, 1 - s);
      ctx.rotate(Math.sin(eating * 18) * 0.09);
    }

    ctx.scale(face, 1);
    if (magaliImg.complete && magaliImg.naturalWidth) {
      ctx.drawImage(magaliImg, -w / 2, -MAG_H / 2, w, MAG_H);
    }
    ctx.restore();
  }

  // ---------- Desenho da melancia (fatia) ----------
  function desenhaMelancia(m) {
    const esc = m.nascendo < 1 ? m.nascendo : 1 + Math.sin(m.t) * 0.05;
    ctx.save();
    ctx.translate(m.x, m.y + Math.sin(m.t * 1.5) * 4);
    ctx.scale(esc, esc);
    ctx.rotate(Math.sin(m.t) * 0.08);

    // sombra
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    ctx.beginPath();
    ctx.ellipse(0, 34, 30, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    // casca
    ctx.fillStyle = '#2e9e44';
    ctx.beginPath();
    ctx.arc(0, 0, 34, 0, Math.PI, false);
    ctx.closePath();
    ctx.fill();
    // casca clara
    ctx.fillStyle = '#bff0c0';
    ctx.beginPath();
    ctx.arc(0, 0, 29, 0, Math.PI, false);
    ctx.closePath();
    ctx.fill();
    // polpa
    ctx.fillStyle = '#ff4f58';
    ctx.beginPath();
    ctx.arc(0, 0, 26, 0, Math.PI, false);
    ctx.closePath();
    ctx.fill();
    // sementes
    ctx.fillStyle = '#222';
    [[-12, 12], [0, 18], [12, 12], [-5, 7], [7, 7]].forEach(([sx, sy]) => {
      ctx.beginPath();
      ctx.ellipse(sx, sy, 2, 3.2, 0.3, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.restore();
  }

  // ---------- Comer ----------
  function come(m, idx) {
    score++;
    placarEl.textContent = '🍉 ' + score;
    placarEl.style.transform = 'translateX(-50%) scale(1.25)';
    setTimeout(() => { placarEl.style.transform = 'translateX(-50%) scale(1)'; }, 150);
    magali.eating = 0.6;
    tocaNham();

    // partículas: pedacinhos de melancia + sementes
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = 60 + Math.random() * 160;
      particulas.push({
        x: m.x, y: m.y,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80,
        vida: 0.7 + Math.random() * 0.4,
        cor: Math.random() < 0.3 ? '#222' : (Math.random() < 0.5 ? '#ff4f58' : '#2e9e44'),
        r: 3 + Math.random() * 4
      });
    }
    const frases = ['NHAM!', 'HMMM!', 'DELÍCIA!', 'QUE DOCE!', '🍉😋'];
    nhams.push({
      x: m.x, y: m.y - 40,
      txt: score % 10 === 0 ? '⭐ ' + score + '! ⭐' : frases[Math.floor(Math.random() * frases.length)],
      vida: 1.2,
      grande: score % 10 === 0
    });
    melancias.splice(idx, 1);
    setTimeout(novaMelancia, 400 + Math.random() * 600);
  }

  // ---------- Fundo ----------
  function desenhaFundo(dt) {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#aee9f5');
    grad.addColorStop(0.65, '#d8f7e0');
    grad.addColorStop(1, '#b6ecab');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // sol
    ctx.fillStyle = '#ffde59';
    ctx.beginPath();
    ctx.arc(W - 70, 80, 38, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,222,89,0.6)';
    ctx.lineWidth = 4;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(W - 70 + Math.cos(a) * 46, 80 + Math.sin(a) * 46);
      ctx.lineTo(W - 70 + Math.cos(a) * 58, 80 + Math.sin(a) * 58);
      ctx.stroke();
    }

    // nuvens
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    nuvens.forEach(n => {
      n.x += n.v * dt;
      if (n.x > W + 80) n.x = -80;
      ctx.save();
      ctx.translate(n.x, n.y);
      ctx.scale(n.s, n.s);
      ctx.beginPath();
      ctx.arc(0, 0, 22, 0, Math.PI * 2);
      ctx.arc(24, 4, 17, 0, Math.PI * 2);
      ctx.arc(-24, 4, 17, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    // movimento pelas setas do teclado (alvo um pouco à frente = ~440 px/s)
    const kx = (teclas.dir ? 1 : 0) - (teclas.esq ? 1 : 0);
    const ky = (teclas.baixo ? 1 : 0) - (teclas.cima ? 1 : 0);
    if (kx || ky) {
      const norm = Math.hypot(kx, ky);
      setAlvo(magali.x + (kx / norm) * 55, magali.y + (ky / norm) * 55);
    }

    // movimento da Magali (segue o dedo com suavidade)
    const dx = magali.tx - magali.x;
    const dy = magali.ty - magali.y;
    magali.x += dx * Math.min(1, dt * 8);
    magali.y += dy * Math.min(1, dt * 8);
    if (Math.abs(dx) > 4) magali.face = dx > 0 ? 1 : -1;
    magali.bob += dt * (Math.hypot(dx, dy) > 10 ? 14 : 4);
    if (magali.eating > 0) magali.eating -= dt;

    // colisão com melancias
    for (let i = melancias.length - 1; i >= 0; i--) {
      const m = melancias[i];
      m.t += dt * 2;
      if (m.nascendo < 1) m.nascendo = Math.min(1, m.nascendo + dt * 3);
      if (Math.hypot(m.x - magali.x, m.y - magali.y) < magali.r + m.r - 10) {
        come(m, i);
      }
    }

    // desenha tudo
    desenhaFundo(dt);
    melancias.forEach(desenhaMelancia);
    desenhaMagali(magali.x, magali.y, magali.face, magali.eating, magali.bob);

    // partículas
    for (let i = particulas.length - 1; i >= 0; i--) {
      const p = particulas[i];
      p.vida -= dt;
      if (p.vida <= 0) { particulas.splice(i, 1); continue; }
      p.vy += 400 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      ctx.globalAlpha = Math.min(1, p.vida * 2);
      ctx.fillStyle = p.cor;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // textos NHAM!
    for (let i = nhams.length - 1; i >= 0; i--) {
      const n = nhams[i];
      n.vida -= dt;
      if (n.vida <= 0) { nhams.splice(i, 1); continue; }
      n.y -= 40 * dt;
      ctx.globalAlpha = Math.min(1, n.vida * 1.5);
      ctx.font = 'bold ' + (n.grande ? 44 : 30) + 'px "Comic Sans MS", cursive, sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#fff';
      ctx.strokeText(n.txt, n.x, n.y);
      ctx.fillStyle = n.grande ? '#e6a817' : '#e63329';
      ctx.fillText(n.txt, n.x, n.y);
      ctx.globalAlpha = 1;
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // hook para testes automatizados
  window.__debug = { magali, melancias, getScore: () => score };
})();
</script>
</body>
</html>
